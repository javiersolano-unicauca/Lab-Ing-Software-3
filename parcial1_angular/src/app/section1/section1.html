<section id="promotions" class="container-fluid row g-0">
    <div id="carousel" class="carousel mt-3 col-11 col-sm-11 col-md-10 col-lg-12 slide container-fluid" data-bs-ride="carousel">
        <div class="carousel-inner w-100 h-100">
            @for(item of items; track $index)
            {
                <div class="carousel-item w-100 h-100 active">
                    <img src="{{item}}.svg" class="d-block img-fluid rounded-4 w-100 h-100" alt="...">
                </div>
            }
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
            <span class="icon rounded-4 d-flex align-items-center justify-content-center p-2">
                <svg xmlns="http://w3.org" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                </svg>
            </span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
            <span class="icon rounded-4 d-flex align-items-center justify-content-center p-2">
                <svg xmlns="http://w3.org" fill="#7DC243;" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                </svg>
            </span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</section>
